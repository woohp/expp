name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: elixir:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: mix deps.get

      - name: Build NIF
        run: make clean && make

      - name: Run tests
        run: mix test
